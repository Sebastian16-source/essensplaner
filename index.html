<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f7d4f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Essensplan">
  <title>Essensplaner</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" href="icon-180.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar"><h1 id="titel">Wochenplan</h1></header>

  <main id="main"></main>

  <nav class="tabbar" aria-label="Navigation">
    <button data-action="tab" data-tab="plan">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      <span>Plan</span>
    </button>
    <button data-action="tab" data-tab="einkauf">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2l2.4 11.2a1 1 0 0 0 1 .8h9.2a1 1 0 0 0 1-.8L20 8H6.2"/><circle cx="9" cy="20" r="1.3"/><circle cx="17" cy="20" r="1.3"/></svg>
      <span>Einkauf</span>
    </button>
    <button data-action="tab" data-tab="rezepte">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H4zM20 4h-4a3 3 0 0 0-3 3v13a2 2 0 0 1 2-2h5z"/></svg>
      <span>Rezepte</span>
    </button>
    <button data-action="tab" data-tab="vorrat">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8l8-4 8 4v10l-8 4-8-4z"/><path d="M4 8l8 4 8-4M12 12v10"/></svg>
      <span>Vorrat</span>
    </button>
    <button data-action="tab" data-tab="mehr">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>
      <span>Mehr</span>
    </button>
  </nav>

  <div id="modal" hidden>
    <div class="modal-hintergrund" data-action="modal-zu"></div>
    <div class="modal-blatt" role="dialog" aria-modal="true"></div>
  </div>

  <div id="toast" role="status" hidden></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
